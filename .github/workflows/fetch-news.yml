name: Fetch News

on:
  schedule:
    - cron: '0 23 * * *'  # 北京时间每天早上 7 点（UTC 23 点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch news
        run: node scripts/fetch-news.js
        env:
          PODCAST_RSS: ${{ secrets.PODCAST_RSS }}
          COFFEE_RSS: ${{ secrets.COFFEE_RSS }}
          FINANCE_RSS_1: ${{ secrets.FINANCE_RSS_1 }}
          FINANCE_RSS_2: ${{ secrets.FINANCE_RSS_2 }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "auto: update news $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
