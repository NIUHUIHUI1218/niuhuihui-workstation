name: Fetch Jobs and Interview Materials

on:
  schedule:
    - cron: '0 11 * * *'  # 北京时间每天晚上 8 点（UTC 11 点）
    - cron: '0 0 * * *'   # 北京时间每天上午 8 点（UTC 0 点）岗位刷新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch jobs & interview
        run: node scripts/fetch-jobs.js
        env:
          JOBS_RSS_1: ${{ secrets.JOBS_RSS_1 }}
          JOBS_RSS_2: ${{ secrets.JOBS_RSS_2 }}
          INTERVIEW_RSS_1: ${{ secrets.INTERVIEW_RSS_1 }}
          INTERVIEW_RSS_2: ${{ secrets.INTERVIEW_RSS_2 }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/interview.json
          git diff --cached --quiet || git commit -m "auto: update jobs & interview $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
